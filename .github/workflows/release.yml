name: release
on:
  push:
    tags: ["v*", "V*"]
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0 or V0.0.1-alpha)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1.1
    strategy:
      matrix:
        board: [sunton_esp32_8048s070]
    steps:
      - uses: actions/checkout@v5
        with:
          # For tag push: github.ref is the tag. For dispatch: use input. For release: use tag_name.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Fix git safe directory (IDF container runs as different user)
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Build ${{ matrix.board }}
        run: |
          . $IDF_PATH/export.sh
          echo "=== DEBUG ==="
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "BOARD=${{ matrix.board }}"
          ls -la $GITHUB_WORKSPACE/devices/${{ matrix.board }}/ || true
          cat $GITHUB_WORKSPACE/devices/${{ matrix.board }}/CMakeLists.txt || true
          # Match ci/idf-build exactly (no -B, no -DBOARD — default board is
          # sunton_esp32_8048s070 via FRAME_DEFAULT_BOARD, so extra flag is
          # not needed and previously broke component discovery)
          idf.py build
          mkdir -p build-${{ matrix.board }} && cp -r build/* build-${{ matrix.board }}/ || true
          # Factory image (merged) + OTA + individual binaries
          esptool.py --chip esp32s3 merge-bin -o build-${{ matrix.board }}/myframe-${{ matrix.board }}.factory.bin \
            --flash-mode qio --flash-freq 80m --flash-size 16MB \
            0x0 build-${{ matrix.board }}/bootloader/bootloader.bin \
            0x8000 build-${{ matrix.board }}/partition_table/partition-table.bin \
            0x10000 build-${{ matrix.board }}/ota_data_initial.bin \
            0x20000 build-${{ matrix.board }}/myframe.bin || \
          esptool.py --chip esp32s3 merge-bin -o build-${{ matrix.board }}/myframe-${{ matrix.board }}.factory.bin \
            --flash-mode qio --flash-freq 80m --flash-size 16MB \
            0x0 build-${{ matrix.board }}/bootloader/bootloader.bin \
            0x8000 build-${{ matrix.board }}/partition_table/partition-table.bin \
            0x20000 build-${{ matrix.board }}/myframe.bin
          cp build-${{ matrix.board }}/myframe.bin build-${{ matrix.board }}/myframe-${{ matrix.board }}.ota.bin || true
          ls -lh build-${{ matrix.board }}/*.bin || true
          cat build-${{ matrix.board }}/flasher_args.json 2>&1 | head -20 || true
          idf.py -B build-${{ matrix.board }} size || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ matrix.board }}
          path: |
            build-${{ matrix.board }}/*.factory.bin
            build-${{ matrix.board }}/*.ota.bin
            build-${{ matrix.board }}/flasher_args.json
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-24.04
    # Run on tag push, release publish, or manual dispatch with a tag
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || inputs.tag != '')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          tag_name: ${{ inputs.tag || github.ref_name || github.event.release.tag_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
