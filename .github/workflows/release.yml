name: release
on:
  push:
    tags: ["v*", "V*"]
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0 or V0.0.1-alpha)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1.1
    strategy:
      matrix:
        board: [sunton_esp32_8048s070]
    steps:
      - uses: actions/checkout@v5
        with:
          # For tag push: github.ref is the tag. For dispatch: use input. For release: use tag_name.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Build ${{ matrix.board }}
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build-${{ matrix.board }} -DBOARD=${{ matrix.board }} build
          # Factory image (merged) + OTA + individual binaries
          esptool.py --chip esp32s3 merge-bin -o build-${{ matrix.board }}/myframe-${{ matrix.board }}.factory.bin \
            --flash-mode qio --flash-freq 80m --flash-size 16MB \
            0x0 build-${{ matrix.board }}/bootloader/bootloader.bin \
            0x8000 build-${{ matrix.board }}/partition_table/partition-table.bin \
            0x10000 build-${{ matrix.board }}/ota_data_initial.bin \
            0x20000 build-${{ matrix.board }}/myframe.bin || \
          esptool.py --chip esp32s3 merge-bin -o build-${{ matrix.board }}/myframe-${{ matrix.board }}.factory.bin \
            --flash-mode qio --flash-freq 80m --flash-size 16MB \
            0x0 build-${{ matrix.board }}/bootloader/bootloader.bin \
            0x8000 build-${{ matrix.board }}/partition_table/partition-table.bin \
            0x20000 build-${{ matrix.board }}/myframe.bin
          cp build-${{ matrix.board }}/myframe.bin build-${{ matrix.board }}/myframe-${{ matrix.board }}.ota.bin
          ls -lh build-${{ matrix.board }}/*.bin || true
          cat build-${{ matrix.board }}/flasher_args.json 2>&1 | head -20 || true
          idf.py -B build-${{ matrix.board }} size
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ matrix.board }}
          path: |
            build-${{ matrix.board }}/*.factory.bin
            build-${{ matrix.board }}/*.ota.bin
            build-${{ matrix.board }}/flasher_args.json
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-24.04
    # Run on tag push, release publish, or manual dispatch with a tag
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || inputs.tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          tag_name: ${{ inputs.tag || github.ref_name || github.event.release.tag_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false

  # On tag/release, also rebuild Pages so flasher sees the new release immediately
  pages:
    needs: build
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
