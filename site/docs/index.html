<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docs — myFrame</title>
<link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../assets/style.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="../"><span class="logo-mark">◧</span> myFrame</a><div class="nav-links"><a href="../docs/">Docs</a><a href="../flasher/">Flasher</a><a href="https://github.com/mytot/myFrame">GitHub</a></div></div></nav>
<div class="docs-layout">
  <aside class="docs-nav" id="docsNav"></aside>
  <main class="docs-content"><div id="doc"></div><div class="muted small" style="margin-top:12px">Edit on GitHub: <a id="editLink" href="#">source</a></div></main>
</div>
<script type="module">
lucide.createIcons();
const docs=[
  {id:"README", file:"../docs/README.md", title:"Overview", nav:"Overview"},
  {id:"IMPLEMENTATION_PLAN", file:"../docs/IMPLEMENTATION_PLAN.md", title:"Implementation Plan", nav:"Plan"},
  {id:"ARCHITECTURE", file:"../docs/ARCHITECTURE.md", title:"Architecture", nav:"Architecture"},
  {id:"RENDER_PERFORMANCE", file:"../docs/RENDER_PERFORMANCE.md", title:"Render Performance", nav:"Render"},
  {id:"FRAMEBUFFER_MEMORY", file:"../docs/FRAMEBUFFER_MEMORY.md", title:"Framebuffer Memory", nav:"Framebuffer"},
  {id:"DEVICE_SUPPORT", file:"../docs/DEVICE_SUPPORT.md", title:"Device Support", nav:"Boards"},
  {id:"DISPLAY_DRIVER", file:"../docs/DISPLAY_DRIVER.md", title:"Display Driver", nav:"Display"},
  {id:"LAUNCHER", file:"../docs/LAUNCHER.md", title:"Launcher", nav:"Launcher"},
  {id:"APP_STORE", file:"../docs/APP_STORE.md", title:"App Store", nav:"App Store"},
  {id:"APP_SDK", file:"../docs/APP_SDK.md", title:"App SDK", nav:"SDK"},
];
const nav=document.getElementById("docsNav");
let html="<h4>Documentation</h4>";
docs.forEach(d=>{
  const a=document.createElement("a");
  a.href=`?doc=${d.id}`; a.textContent=d.nav; a.dataset.id=d.id;
  html+=a.outerHTML;
});
html+='<h4 style="margin-top:12px">Links</h4><a href="../flasher/">Web Flasher</a><a href="https://github.com/mytot/myFrame/releases">Releases</a>';
nav.innerHTML=html;

function getDocId(){ return new URLSearchParams(location.search).get("doc") || "README"; }
async function load(id){
  const d=docs.find(x=>x.id===id) || docs[0];
  document.querySelectorAll(".docs-nav a").forEach(a=>a.classList.toggle("active", a.dataset.id===d.id));
  document.getElementById("editLink").href=`https://github.com/mytot/myFrame/blob/main/docs/${d.id}.md`;
  document.title=`${d.title} — myFrame`;
  try{
    const t=await (await fetch(d.file)).text();
    document.getElementById("doc").innerHTML = marked.parse(t);
    window.scrollTo(0,0);
    // fix relative links to stay in docs viewer
    document.querySelectorAll("#doc a").forEach(a=>{
      if(a.getAttribute("href")?.endsWith(".md")){
        const base=a.getAttribute("href").replace(".md","");
        const target=docs.find(x=>x.id===base);
        if(target){ a.href=`?doc=${target.id}`; }
      }
    });
    lucide.createIcons();
  }catch(e){
    document.getElementById("doc").innerHTML=`<p>Failed to load ${d.file}: ${e}</p>`;
  }
}
load(getDocId());
window.addEventListener("popstate",()=>load(getDocId()));
nav.addEventListener("click",e=>{
  if(e.target.tagName==="A" && e.target.dataset.id){
    e.preventDefault();
    history.pushState(null,"",`?doc=${e.target.dataset.id}`);
    load(e.target.dataset.id);
  }
});
</script>
</body>
</html>
